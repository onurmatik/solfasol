{% extends "base.html" %}

{% block title %}Giriş - Solfasol{% endblock %}

{% block content %}
  <section class="panel" style="max-width: 460px; margin: 40px auto;">
    <div class="stack">
      <div>
        <p class="eyebrow">Kapalı üyelik</p>
        <h1>Solfasol giriş</h1>
        <p class="muted">Hesabınız yoksa mevcut bir üyeden davet linki almanız gerekir.</p>
      </div>
      <form method="post" class="stack">
        {% csrf_token %}
        {{ form.as_div }}
        <div class="form-actions">
          <button class="primary" type="submit">Giriş yap</button>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
