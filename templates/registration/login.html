{% extends "base.html" %}

{% block title %}Giriş - Solfasol{% endblock %}

{% block content %}
  <section class="panel" style="max-width: 460px; margin: 40px auto;">
    <div class="stack">
      <div>
        <h1>Solfasol giriş</h1>
      </div>
      <form method="post" class="stack">
        {% csrf_token %}
        {{ form.as_div }}
        <div class="form-actions">
          <button class="primary" type="submit">Giriş yap</button>
          <a class="button" href="{% url 'signup' %}">Kayıt ol</a>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
